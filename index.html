<script>

/* =========================================================
   CHAT IMPLEMENTATION
========================================================= */

async function sendMessage(){

  if(isSending){
    return;
  }

  const input = $("chatInput");
  const text = input.value.trim();

  if(!text){
    return;
  }

  input.value = "";
  appendMessage(text, "user");

  isSending = true;
  $("sendButton").disabled = true;

  const typingId = appendMessage("Emlieey is typing...", "bot typing");

  try {
    const username = currentUser ? currentUser.username : (getSavedUsername() || "guest");

    const response = await apiRequest("/api/chat", {
      method: "POST",
      body: JSON.stringify({
        message: text,
        username: username
      })
    });

    removeMessage(typingId);

    const botReply = response.reply || response.message || "ah ijj parayu 😌";
    appendMessage(botReply, "bot");

    if (response.user) {
      currentUser = response.user;
      renderProfile(currentUser);
    }

  } catch (error) {
    console.error("Chat Error:", error);
    removeMessage(typingId);
    appendMessage("connection error scene aan... pinne nokk 🤖", "bot");
  } finally {
    isSending = false;
    $("sendButton").disabled = false;
  }
}

function appendMessage(text, senderClass) {
  const messagesContainer = $("messages");
  const msgElement = document.createElement("div");
  const msgId = "msg_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);

  msgElement.id = msgId;
  msgElement.className = "message " + senderClass;
  msgElement.textContent = text;

  messagesContainer.appendChild(msgElement);
  messagesContainer.scrollTop = messagesContainer.scrollHeight;

  return msgId;
}

function removeMessage(msgId) {
  const el = $(msgId);
  if (el) {
    el.remove();
  }
}

// Allow pressing Enter in chat input
$("chatInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});


/* =========================================================
   LEADERBOARD
========================================================= */

async function loadLeaderboard() {
  const container = $("leaderboardList");
  container.innerHTML = '<div class="card" style="text-align:center;">loading ranks...</div>';

  try {
    const data = await apiRequest("/api/leaderboard", { method: "GET" });
    const list = data.leaderboard || data.users || [];

    if (!Array.isArray(list) || list.length === 0) {
      container.innerHTML = '<div class="card" style="text-align:center;color:#817788;">no leaderboard data yet</div>';
      return;
    }

    container.innerHTML = "";
    list.forEach((player, index) => {
      const row = document.createElement("div");
      row.className = "leader-row";

      const rank = index + 1;
      const rankBadge = rank === 1 ? "🥇 #1" : rank === 2 ? "🥈 #2" : rank === 3 ? "🥉 #3" : "#" + rank;

      row.innerHTML = `
        <div class="rank">${rankBadge}</div>
        <div>
          <div class="player-name">${escapeHTML(player.username)}</div>
          <small class="player-level">Level ${Number(player.level || 1)}</small>
        </div>
        <div class="player-points">${Number(player.points || 0).toLocaleString()} PTS</div>
      `;

      container.appendChild(row);
    });

  } catch (error) {
    console.error("Leaderboard Error:", error);
    container.innerHTML = '<div class="card" style="text-align:center;color:#ef4444;">failed to load leaderboard</div>';
  }
}


/* =========================================================
   DAILY REWARDS & SPIN
========================================================= */

async function claimReward() {
  const target = $("rewardResult");
  const username = currentUser ? currentUser.username : getSavedUsername();

  if (!username) {
    target.textContent = "Please enter and load your profile first!";
    return;
  }

  target.textContent = "claiming reward...";

  try {
    const data = await apiRequest("/api/reward", {
      method: "POST",
      body: JSON.stringify({ username: username })
    });

    target.textContent = data.message || "Daily reward claimed successfully! 🎉";
    if (data.user) {
      currentUser = data.user;
      renderProfile(currentUser);
    }
  } catch (err) {
    target.textContent = err.message || "Failed to claim reward.";
  }
}

async function spinWheel() {
  const target = $("rewardResult");
  const username = currentUser ? currentUser.username : getSavedUsername();

  if (!username) {
    target.textContent = "Load profile first!";
    return;
  }

  target.textContent = "spinning the wheel... 🎡";

  setTimeout(async () => {
    try {
      const data = await apiRequest("/api/spin", {
        method: "POST",
        body: JSON.stringify({ username: username })
      });

      target.textContent = data.message || "Spin complete!";
      if (data.user) {
        currentUser = data.user;
        renderProfile(currentUser);
      }
    } catch (err) {
      target.textContent = "Wheel spin unavailable right now.";
    }
  }, 1200);
}


/* =========================================================
   MINIGAMES
========================================================= */

async function playDice() {
  const target = $("diceResult");
  const username = currentUser ? currentUser.username : getSavedUsername();

  target.textContent = "rolling dice... 🎲";

  try {
    const res = await apiRequest("/api/games/dice", {
      method: "POST",
      body: JSON.stringify({ username: username })
    });

    target.textContent = res.message || `Rolled a ${res.roll || 6}!`;
    if (res.user) {
      currentUser = res.user;
      renderProfile(currentUser);
    }
  } catch (err) {
    const roll = Math.floor(Math.random() * 6) + 1;
    target.textContent = `You rolled a ${roll}!`;
  }
}

async function playFlip() {
  const target = $("flipResult");
  const username = currentUser ? currentUser.username : getSavedUsername();

  target.textContent = "flipping coin... 🪙";

  setTimeout(async () => {
    try {
      const res = await apiRequest("/api/games/flip", {
        method: "POST",
        body: JSON.stringify({ username: username })
      });

      target.textContent = res.message || `Coin landed on ${res.outcome || "Heads"}!`;
      if (res.user) {
        currentUser = res.user;
        renderProfile(currentUser);
      }
    } catch (err) {
      const side = Math.random() > 0.5 ? "Heads" : "Tails";
      target.textContent = `Result: ${side}!`;
    }
  }, 600);
}

async function playGuess() {
  const target = $("guessResult");
  const guessInput = $("guessInput");
  const val = parseInt(guessInput.value, 10);
  const username = currentUser ? currentUser.username : getSavedUsername();

  if (isNaN(val) || val < 1 || val > 10) {
    target.textContent = "Enter a valid number between 1 and 10";
    return;
  }

  target.textContent = "checking guess...";

  try {
    const res = await apiRequest("/api/games/guess", {
      method: "POST",
      body: JSON.stringify({ username: username, guess: val })
    });

    target.textContent = res.message;
    if (res.user) {
      currentUser = res.user;
      renderProfile(currentUser);
    }
  } catch (err) {
    const targetNum = Math.floor(Math.random() * 10) + 1;
    target.textContent = val === targetNum ? "🎯 Correct guess!" : `Wrong! The number was ${targetNum}`;
  }
}

function openGameModal(title, contentHTML) {
  $("modalTitle").textContent = title;
  $("modalContent").innerHTML = contentHTML;
  $("gameModal").style.display = "flex";
}

function closeGameModal() {
  $("gameModal").style.display = "none";
}

function playQuiz() {
  openGameModal("🧠 Community Quiz", `
    <p>What powers the Emlieey AI bot engine?</p>
    <div style="display:grid;gap:8px;margin-top:15px;">
      <button class="poll-option" onclick="submitQuizAnswer('wrong')">A) Python Script</button>
      <button class="poll-option" onclick="submitQuizAnswer('correct')">B) Groq & Cloudflare Workers</button>
      <button class="poll-option" onclick="submitQuizAnswer('wrong')">C) WordPress Plugin</button>
    </div>
  `);
}

function submitQuizAnswer(type) {
  if (type === "correct") {
    openGameModal("🎉 Correct!", "<p>You earned <strong>+50 XP</strong> and <strong>+20 Points</strong>!</p>");
  } else {
    openGameModal("❌ Missed!", "<p>Nice try! Check out the features list and try again.</p>");
  }
}

function playWord() {
  openGameModal("🔤 Word Guess", "<p>Feature coming soon in the next Emlieey release!</p>");
}

function playRace() {
  openGameModal("🏎️ Community Race", "<p>Preparing track... Next live stream race starts soon!</p>");
}

async function playJackpot() {
  const target = $("jackpotResult");
  target.textContent = "spinning slots... 🎰";

  setTimeout(() => {
    const symbols = ["🍒", "🍋", "7️⃣", "💎", "⭐"];
    const s1 = symbols[Math.floor(Math.random() * symbols.length)];
    const s2 = symbols[Math.floor(Math.random() * symbols.length)];
    const s3 = symbols[Math.floor(Math.random() * symbols.length)];

    if (s1 === s2 && s2 === s3) {
      target.textContent = `[ ${s1} | ${s2} | ${s3} ] 💥 JACKPOT! You won +500 PTS!`;
    } else {
      target.textContent = `[ ${s1} | ${s2} | ${s3} ] Better luck next spin!`;
    }
  }, 1000);
}

function showAchievements() {
  const user = currentUser;
  if (!user || !user.achievements || user.achievements.length === 0) {
    openGameModal("🏅 Achievements", "<p>No achievements unlocked yet. Stay active in chat and play games!</p>");
  } else {
    const list = user.achievements.map(a => `<div style="padding:6px;border-bottom:1px solid rgba(255,255,255,0.1);">🏅 ${a.achievement || a}</div>`).join("");
    openGameModal("🏅 Your Achievements", list);
  }
}


/* =========================================================
   MISCELLANEOUS / POLLS / BACKEND STATUS
========================================================= */

function votePoll(optionIndex) {
  const options = ["Games", "Music", "AI Features", "Community Features"];
  $("pollResult").textContent = `Thanks for voting for: "${options[optionIndex]}"!`;
}

async function checkBackendStatus() {
  const dot = $("backendDot");
  const label = $("backendStatus");

  try {
    const res = await apiRequest("/health", { method: "GET" });
    dot.style.background = "#22c55e"; // green
    dot.style.boxShadow = "0 0 10px #22c55e";
    label.textContent = "online & connected";
    if (res.online_users) {
      $("onlineCount").textContent = res.online_users;
    } else {
      $("onlineCount").textContent = "12";
    }
  } catch (e) {
    // Graceful offline display
    dot.style.background = "#eab308"; // yellow
    label.textContent = "active (fallback mode)";
    $("onlineCount").textContent = "1";
  }
}

function showMessage(msg, category) {
  console.log(`[${category}] ${msg}`);
}


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
  // Set current copyright year
  const yearEl = $("currentYear");
  if (yearEl) {
    yearEl.textContent = new Date().getFullYear();
  }

  // Load saved username if present
  const saved = getSavedUsername();
  if (saved) {
    const input = $("usernameInput");
    if (input) {
      input.value = saved;
      loadProfile();
    }
  }

  // Initial loads
  loadLeaderboard();
  checkBackendStatus();
});

</script>
</body>
</html>
