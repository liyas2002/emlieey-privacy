<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#090b0f">
  <title>Chat with emLee</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .chat-page {
      padding-bottom: 80px;
    }

    .ai-chat {
      max-width: 820px;
      margin: 0 auto;
    }

    .chat-window {
      min-height: 520px;
      max-height: 620px;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 22px 22px 0 0;
      background: var(--card);
    }

    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 12px;
      white-space: pre-wrap;
    }

    .message.bot .bubble {
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
    }

    .message.user .bubble {
      background: var(--accent);
      color: #090b0f;
      font-weight: 600;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 22px 22px;
      background: #0d1015;
    }

    .chat-input-area input {
      margin: 0;
    }

    .chat-input-area button {
      flex: 0 0 auto;
    }

    .typing {
      color: var(--muted);
      font-size: 10px;
      margin: 4px 0 15px;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">e</span>
    <span>emLee</span>
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="chat.html" class="active">Chat Room</a>
    <a href="rank.html">Rank</a>
  </nav>

  <div class="header-actions">
    <a href="profile.html" class="profile-button">
      <span id="headerAvatar">?</span>
      <span id="headerUsername">profile</span>
    </a>
  </div>
</header>

<main class="chat-page">

  <section class="page-header">
    <span class="eyebrow">private ai conversation</span>
    <h1>chat with emLee</h1>
    <p>
      talk directly with the emLee AI.
    </p>
  </section>

  <section class="ai-chat">

    <div
      id="chatWindow"
      class="chat-window">

      <div class="message bot">
        <div class="bubble">
          hey! what's up?
        </div>
      </div>

    </div>

    <div class="chat-input-area">

      <input
        id="chatInput"
        class="text-input"
        maxlength="500"
        placeholder="type a message..."
        autocomplete="off">

      <button
        id="sendButton"
        class="primary-btn">
        send
      </button>

    </div>

    <div
      id="typing"
      class="typing"
      style="display:none">
      emLee is typing...
    </div>

  </section>

</main>

<footer class="site-footer">
  <div>
    <strong>emLee</strong>
    <span>community space</span>
  </div>

  <div class="social-icons">
    <a href="https://www.instagram.com/liyasmv"
       target="_blank"
       rel="noopener">◎</a>

    <a href="https://youtube.com/@liyaasmv"
       target="_blank"
       rel="noopener">▶</a>

    <a href="mailto:liyasmuhammedmv@gmail.com">@</a>
  </div>

  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>

  <small>© <span class="current-year"></span> emLee</small>
</footer>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

<script>
async function sendAIMessage() {

  const input =
    document.getElementById(
      "chatInput"
    );

  const message =
    input.value.trim();

  const username =
    getSavedUsername();

  if (!username) {

    showMessage(
      "set your username first"
    );

    return;

  }

  if (!message) return;

  addChatMessage(
    message,
    "user"
  );

  input.value = "";

  document.getElementById(
    "typing"
  ).style.display = "block";

  input.disabled = true;

  try {

    const data =
      await apiRequest(
        "/api/chat",
        {
          method: "POST",
          body: JSON.stringify({
            message,
            username
          })
        }
      );

    const reply =
      data.reply ??
      data.message ??
      data.response ??
      "i couldn't reply right now.";

    addChatMessage(
      reply,
      "bot"
    );

  } catch (error) {

    addChatMessage(
      "something went wrong. try again.",
      "bot"
    );

    console.error(error);

  } finally {

    document.getElementById(
      "typing"
    ).style.display = "none";

    input.disabled = false;

    input.focus();

  }

}


function addChatMessage(
  text,
  type
) {

  const windowEl =
    document.getElementById(
      "chatWindow"
    );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  windowEl.appendChild(
    wrapper
  );

  windowEl.scrollTop =
    windowEl.scrollHeight;

}


document.getElementById(
  "sendButton"
).onclick =
  sendAIMessage;


document.getElementById(
  "chatInput"
).onkeydown =
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendAIMessage();

    }

  };


document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCurrentYear();

    updateHeader(
      getSavedUsername()
    );

  }
);
</script>

</body>
</html>
