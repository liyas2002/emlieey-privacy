<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#090b0f">
  <title>Private Chat — emLee</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .private-page {
      padding-bottom: 80px;
    }

    .private-chat {
      max-width: 900px;
      margin: 0 auto;
    }

    .private-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 20px 20px 0 0;
      background: #0d1015;
    }

    .private-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(217,255,85,.1);
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
    }

    .private-name {
      font-size: 13px;
      font-weight: 800;
    }

    .private-status {
      color: var(--muted);
      font-size: 9px;
    }

    .private-messages {
      height: 550px;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .private-message {
      max-width: 72%;
      margin-bottom: 12px;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 12px;
    }

    .private-message.mine {
      margin-left: auto;
      background: var(--accent);
      color: #090b0f;
    }

    .private-message.theirs {
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
    }

    .private-compose {
      display: flex;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 20px 20px;
      background: #0d1015;
    }

    .private-compose input {
      margin: 0;
    }
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">e</span>
    <span>emLee</span>
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="chat.html">Chat Room</a>
    <a href="rank.html">Rank</a>
  </nav>

  <div class="header-actions">
    <a href="profile.html" class="profile-button">
      <span id="headerAvatar">?</span>
      <span id="headerUsername">profile</span>
    </a>
  </div>
</header>

<main class="private-page">

  <section class="page-header">
    <span class="eyebrow">1 — 1</span>
    <h1>private chat</h1>
    <p>
      direct messages between community members.
    </p>
  </section>

  <section class="private-chat">

    <div class="private-header">

      <div
        id="privateAvatar"
        class="private-avatar">
        ?
      </div>

      <div>
        <div
          id="privateName"
          class="private-name">
          select a user
        </div>

        <div
          id="privateStatus"
          class="private-status">
          private conversation
        </div>
      </div>

    </div>

    <div
      id="privateMessages"
      class="private-messages">

      <div style="color:var(--muted);
                  font-size:12px">
        loading...
      </div>

    </div>

    <div class="private-compose">

      <input
        id="privateInput"
        class="text-input"
        maxlength="500"
        placeholder="write a private message..."
        autocomplete="off">

      <button
        id="privateSend"
        class="primary-btn">
        send
      </button>

    </div>

  </section>

</main>

<footer class="site-footer">
  <div>
    <strong>emLee</strong>
    <span>community space</span>
  </div>

  <div class="social-icons">
    <a href="https://www.instagram.com/liyasmv"
       target="_blank"
       rel="noopener">◎</a>

    <a href="https://youtube.com/@liyaasmv"
       target="_blank"
       rel="noopener">▶</a>

    <a href="mailto:liyasmuhammedmv@gmail.com">@</a>
  </div>

  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>

  <small>© <span class="current-year"></span> emLee</small>
</footer>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

<script>
const params =
  new URLSearchParams(
    location.search
  );

const targetUser =
  params.get("user") || "";


/*
  Required Worker routes for true private messaging:

  GET  /api/private-chat?userA=...&userB=...
  POST /api/private-chat
       {
         from,
         to,
         message
       }

  POST /api/private-chat/block
       {
         blocker,
         blocked
       }

  POST /api/private-chat/report
       {
         reporter,
         reported,
         reason
       }

  The frontend below is ready for those routes.
*/


async function loadPrivateChat() {

  const currentUser =
    getSavedUsername();

  if (!currentUser) {

    location.href =
      "index.html";

    return;

  }

  if (!targetUser) {

    document.getElementById(
      "privateName"
    ).textContent =
      "no user selected";

    document.getElementById(
      "privateMessages"
    ).innerHTML = `
      <div style="color:var(--muted);
                  font-size:12px">
        open a profile and tap message.
      </div>
    `;

    return;

  }


  document.getElementById(
    "privateName"
  ).textContent =
    targetUser;

  document.getElementById(
    "privateAvatar"
  ).textContent =
    getInitial(targetUser);


  try {

    const data =
      await apiRequest(
        "/api/private-chat?userA=" +
        encodeURIComponent(currentUser) +
        "&userB=" +
        encodeURIComponent(targetUser)
      );

    const messages =
      Array.isArray(data)
        ? data
        : (
            data.messages ||
            data.data ||
            []
          );

    renderPrivateMessages(
      messages,
      currentUser
    );

  } catch (error) {

    document.getElementById(
      "privateMessages"
    ).innerHTML = `
      <div style="color:var(--muted);
                  font-size:12px">
        private chat backend is not connected yet.
      </div>
    `;

  }

}


function renderPrivateMessages(
  messages,
  currentUser
) {

  const container =
    document.getElementById(
      "privateMessages"
    );

  if (!messages.length) {

    container.innerHTML = `
      <div style="color:var(--muted);
                  font-size:12px">
        no messages yet. start the conversation.
      </div>
    `;

    return;

  }

  container.innerHTML =
    messages.map(message => {

      const from =
        message.from ||
        message.sender ||
        message.username ||
        "";

      const text =
        message.message ||
        message.text ||
        "";

      const mine =
        from.toLowerCase() ===
        currentUser.toLowerCase();

      return `
        <div class="
          private-message
          ${mine ? "mine" : "theirs"}
        ">
          ${escapeHTML(text)}
        </div>
      `;

    }).join("");

  container.scrollTop =
    container.scrollHeight;

}


async function sendPrivateMessage() {

  const currentUser =
    getSavedUsername();

  const input =
    document.getElementById(
      "privateInput"
    );

  const message =
    input.value.trim();

  if (!currentUser || !targetUser) {

    showMessage(
      "select a user first"
    );

    return;

  }

  if (!message) return;

  try {

    await apiRequest(
      "/api/private-chat",
      {
        method: "POST",
        body: JSON.stringify({
          from: currentUser,
          to: targetUser,
          message
        })
      }
    );

    input.value = "";

    await loadPrivateChat();

  } catch (error) {

    showMessage(
      "private chat backend is not available yet"
    );

  }

}


document.getElementById(
  "privateSend"
).onclick =
  sendPrivateMessage;


document.getElementById(
  "privateInput"
).onkeydown =
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendPrivateMessage();

    }

  };


document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCurrentYear();

    updateHeader(
      getSavedUsername()
    );

    loadPrivateChat();

    setInterval(
      loadPrivateChat,
      5000
    );

  }
);
</script>

</body>
</html>
