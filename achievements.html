<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#090b0f">
  <title>Achievements — emLee</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .achievement-page {
      padding-bottom: 100px;
    }

    .achievement-summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .achievement-stat {
      padding: 22px;
    }

    .achievement-stat span {
      color: var(--muted);
      font-size: 10px;
    }

    .achievement-stat strong {
      display: block;
      margin-top: 5px;
      font-size: 28px;
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
    }

    .achievement-card {
      min-height: 175px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
    }

    .achievement-card.unlocked {
      border-color: rgba(217,255,85,.28);
    }

    .achievement-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: var(--muted);
    }

    .unlocked .achievement-icon {
      background: rgba(217,255,85,.1);
      color: var(--accent);
    }

    .achievement-card h2 {
      margin-top: 18px;
      font-size: 16px;
    }

    .achievement-card p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .achievement-status {
      display: block;
      margin-top: 15px;
      color: var(--muted-2);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .unlocked .achievement-status {
      color: var(--accent);
    }

    @media(max-width:800px) {
      .achievement-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .achievement-summary {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:500px) {
      .achievement-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">e</span>
    <span>emLee</span>
  </a>

  <nav class="desktop-nav">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="chat.html">Chat Room</a>
    <a href="rank.html">Rank</a>
  </nav>

  <div class="header-actions">
    <a href="profile.html" class="profile-button">
      <span id="headerAvatar">?</span>
      <span id="headerUsername">profile</span>
    </a>
  </div>
</header>

<main class="achievement-page">

  <section class="page-header">
    <span class="eyebrow">milestones</span>
    <h1>achievements</h1>
    <p>
      milestones you unlock while using emLee.
    </p>
  </section>

  <section class="achievement-summary">

    <div class="card achievement-stat">
      <span>unlocked</span>
      <strong id="unlockedCount">0</strong>
    </div>

    <div class="card achievement-stat">
      <span>games played</span>
      <strong id="achievementGames">0</strong>
    </div>

    <div class="card achievement-stat">
      <span>current streak</span>
      <strong id="achievementStreak">0</strong>
    </div>

  </section>

  <section
    id="achievementGrid"
    class="achievement-grid">
  </section>

</main>

<footer class="site-footer">
  <div>
    <strong>emLee</strong>
    <span>community space</span>
  </div>

  <div class="social-icons">
    <a href="https://www.instagram.com/liyasmv"
       target="_blank"
       rel="noopener">◎</a>

    <a href="https://youtube.com/@liyaasmv"
       target="_blank"
       rel="noopener">▶</a>

    <a href="mailto:liyasmuhammedmv@gmail.com">@</a>
  </div>

  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </div>

  <small>© <span class="current-year"></span> emLee</small>
</footer>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

<script>
const achievements = [

  {
    id: "first-game",
    icon: "01",
    title: "First Game",
    description: "complete your first game.",
    check: p =>
      Number(
        p.gamesPlayed ??
        p.games_played ??
        0
      ) >= 1
  },

  {
    id: "five-games",
    icon: "05",
    title: "Getting Started",
    description: "play five games.",
    check: p =>
      Number(
        p.gamesPlayed ??
        p.games_played ??
        0
      ) >= 5
  },

  {
    id: "ten-games",
    icon: "10",
    title: "Game Time",
    description: "play ten games.",
    check: p =>
      Number(
        p.gamesPlayed ??
        p.games_played ??
        0
      ) >= 10
  },

  {
    id: "first-win",
    icon: "W",
    title: "First Win",
    description: "win your first game.",
    check: p =>
      Number(
        p.wins ?? 0
      ) >= 1
  },

  {
    id: "five-wins",
    icon: "5W",
    title: "Winner",
    description: "collect five wins.",
    check: p =>
      Number(
        p.wins ?? 0
      ) >= 5
  },

  {
    id: "points-100",
    icon: "100",
    title: "100 Points",
    description: "reach 100 points.",
    check: p =>
      Number(
        p.points ?? 0
      ) >= 100
  },

  {
    id: "points-500",
    icon: "500",
    title: "500 Points",
    description: "reach 500 points.",
    check: p =>
      Number(
        p.points ?? 0
      ) >= 500
  },

  {
    id: "streak-3",
    icon: "3",
    title: "Three Day Streak",
    description: "maintain a 3 day streak.",
    check: p =>
      Number(
        p.streak ??
        p.daily_streak ??
        0
      ) >= 3
  },

  {
    id: "streak-7",
    icon: "7",
    title: "Seven Day Streak",
    description: "maintain a 7 day streak.",
    check: p =>
      Number(
        p.streak ??
        p.daily_streak ??
        0
      ) >= 7
  }

];


async function loadAchievements() {

  updateCurrentYear();

  const username =
    getSavedUsername();

  updateHeader(username);

  if (!username) {

    location.href =
      "index.html";

    return;

  }

  const profile =
    await loadProfile(username);

  if (!profile) return;


  const games =
    Number(
      profile.gamesPlayed ??
      profile.games_played ??
      0
    );

  const wins =
    Number(
      profile.wins ?? 0
    );

  const streak =
    Number(
      profile.streak ??
      profile.daily_streak ??
      0
    );


  document.getElementById(
    "achievementGames"
  ).textContent =
    games;

  document.getElementById(
    "achievementStreak"
  ).textContent =
    streak;


  const unlocked =
    achievements.filter(
      item => item.check(profile)
    );


  document.getElementById(
    "unlockedCount"
  ).textContent =
    unlocked.length;


  document.getElementById(
    "achievementGrid"
  ).innerHTML =
    achievements.map(item => {

      const isUnlocked =
        item.check(profile);

      return `
        <article
          class="
            achievement-card
            ${isUnlocked ? "unlocked" : ""}
          ">

          <div class="achievement-icon">
            ${escapeHTML(item.icon)}
          </div>

          <h2>
            ${escapeHTML(item.title)}
          </h2>

          <p>
            ${escapeHTML(item.description)}
          </p>

          <span class="achievement-status">
            ${
              isUnlocked
                ? "unlocked"
                : "locked"
            }
          </span>

        </article>
      `;

    }).join("");

}


document.addEventListener(
  "DOMContentLoaded",
  loadAchievements
);
</script>

</body>
</html>
